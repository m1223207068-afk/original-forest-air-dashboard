services:
  - type: web
    name: original-forest-air-dashboard
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    envVars:
      - key: WEATHER_PROVIDER
        value: open_meteo
      - key: WEATHER_LATITUDE
        value: "30.048"
      - key: WEATHER_LONGITUDE
        value: "119.960"
      - key: WEATHER_CITY_NAME
        value: 杭州富阳
